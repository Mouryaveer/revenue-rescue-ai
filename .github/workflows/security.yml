name: Security Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # weekly Monday 2am

jobs:
  bandit:
    name: Python Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r backend/app agents policies simulator -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  secrets-scan:
    name: Check No Secrets Committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for .env files
        run: |
          if find . -name ".env" -not -path "./.env.example" -not -path "*/node_modules/*" | grep -q .; then
            echo "ERROR: .env file found in repository"
            exit 1
          fi
          echo "No .env files found — safe to proceed"
      - name: Check no hardcoded API keys
        run: |
          if grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.ts" --include="*.tsx" \
             --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "ERROR: Possible OpenAI API key found"
            exit 1
          fi
          echo "No hardcoded API keys found"

[alembic]
# Path relative to where alembic is run from (/app/backend inside Docker, project root locally)
script_location = database/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://revenuerescue:revenuerescue@postgres:5432/revenuerescue

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend/tests",
    "policies/tests",
    "simulator/tests",
    "agents/tests",
    "tests",
]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "S311", "B008", "A002"]

[tool.ruff.per-file-ignores]
"*/tests/*" = ["S", "T20"]
"*/seed/*"  = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["database/migrations"]

[tool.bandit]
skips = ["B101", "B311"]
exclude_dirs = ["tests", "database/migrations"]

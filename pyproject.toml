[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "backend/tests",
    "policies/tests",
    "simulator/tests",
    "agents/tests",
    "tests",
]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = [
    "S101", "S311", "B008", "A002",
    "UP042",   # StrEnum migration — not worth churn
    "B017",    # pytest.raises(Exception) in tests
    "F841",    # unused locals in tests are intentional
    "C408",    # dict() call style
    "E501",    # line-length handled by formatter
    "F821",    # SQLAlchemy forward-reference string annotations (false positives)
    "B904",    # raise-without-from-inside-except — acceptable in task/API handlers
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "T20", "F401", "F811"]
"*/seed/*"  = ["T20", "F401"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["database/migrations"]

[tool.bandit]
skips = ["B101", "B311", "B107"]
exclude_dirs = ["tests", "database/migrations"]

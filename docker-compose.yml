services:
  postgres:
    image: postgres:16-alpine
    container_name: rr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revenuerescue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenuerescue}
      POSTGRES_DB: ${POSTGRES_DB:-revenuerescue}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenuerescue}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rr_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/backend
      - LANGCHAIN_TRACING_V2=false
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-simulator}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /app/backend

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: rr_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/backend
      - LANGCHAIN_TRACING_V2=false
    command: celery -A app.core.celery_app worker --loglevel=info

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: rr_frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_MODE=simulation
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
